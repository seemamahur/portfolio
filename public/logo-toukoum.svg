<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AA70" />
      <stop offset="30%" stop-color="#8C533E" />
      <stop offset="50%" stop-color="#F5C09B" />
      <stop offset="70%" stop-color="#5E3326" />
      <stop offset="100%" stop-color="#B87333" />
    </linearGradient>

    <!-- Metallic Text/Inner Ring Gradient -->
    <linearGradient id="copperText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0A96D" />
      <stop offset="50%" stop-color="#FAD6A5" />
      <stop offset="100%" stop-color="#C5834C" />
    </linearGradient>

    <!-- Red/Copper Monogram Strand -->
    <linearGradient id="strandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9534F" />
      <stop offset="50%" stop-color="#B22222" />
      <stop offset="100%" stop-color="#6B1111" />
    </linearGradient>

    <!-- Blue Monogram Strand -->
    <linearGradient id="strandBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6984" />
      <stop offset="50%" stop-color="#2C3E50" />
      <stop offset="100%" stop-color="#1A252F" />
    </linearGradient>

    <!-- Lightning Bolt Bright Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="40%" stop-color="#FF8C00" />
      <stop offset="100%" stop-color="#B22222" />
    </linearGradient>

    <!-- Dark Marble Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A2E33" />
      <stop offset="70%" stop-color="#15181B" />
      <stop offset="100%" stop-color="#0B0D0F" />
    </radialGradient>

    <!-- Carbon Fiber Pattern for Background texture -->
    <pattern id="carbonPattern" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#121417"/>
      <polygon points="0,0 3,0 0,3" fill="#1c2024"/>
      <polygon points="3,3 6,3 3,6" fill="#1c2024"/>
      <polygon points="3,3 6,3 6,0" fill="#252a30"/>
      <polygon points="0,3 3,3 0,6" fill="#252a30"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Path for Circular Name -->
    <path id="textArc" d="M 105, 335 A 170,170 0 0,0 395, 335" />
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#carbonPattern)" />

  <!-- Outer Metallic Circular Frame -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#metalRim)" stroke-width="14" filter="url(#dropShadow)" />
  <circle cx="250" cy="250" r="212" fill="none" stroke="#000" stroke-width="2" opacity="0.8" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#metalRim)" stroke-width="4" />

  <!-- Inner Dark Marble Base -->
  <circle cx="250" cy="250" r="193" fill="url(#bgGrad)" />

  <!-- Inner Notch/Tread Details around Rim -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#copperText)" stroke-width="6" stroke-dasharray="2, 6" opacity="0.7" />
  <circle cx="250" cy="250" r="176" fill="none" stroke="url(#metalRim)" stroke-width="2" />

  <!-- Central Emblem Monogram (S + M Hybrid Structure) -->
  <g filter="url(#dropShadow)">
    <!-- "S" Left Red/Copper Mesh Curve -->
    <path d="M 160 170 C 160 130, 230 130, 240 170 C 250 200, 170 220, 180 270 C 190 310, 260 300, 250 260" 
          fill="none" stroke="url(#strandRed)" stroke-width="24" stroke-linecap="round"/>
    
    <!-- "M" Right Blue/Slate Mesh Leg -->
    <path d="M 240 270 L 270 170 L 300 240 L 330 170 L 330 290" 
          fill="none" stroke="url(#strandBlue)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Outer Metallic Outline on Monogram -->
    <path d="M 160 170 C 160 130, 230 130, 240 170 C 250 200, 170 220, 180 270 C 190 310, 260 300, 250 260" 
          fill="none" stroke="url(#metalRim)" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Sharp Diagonal Lightning Bolt Cutting Across -->
  <g filter="url(#dropShadow)">
    <polygon points="320,40 240,220 275,220 170,420 270,245 230,245" fill="url(#boltGrad)" filter="url(#glow)"/>
    <!-- Highlight Edge on Lightning Bolt -->
    <polygon points="320,40 240,220 275,220 225,320" fill="#FFF" opacity="0.3"/>
  </g>

  <!-- Bottom Metallic Banner Cutout for Text -->
  <path d="M 115 320 A 170 170 0 0 0 385 320 L 370 375 A 193 193 0 0 1 130 375 Z" fill="#111417" opacity="0.85" stroke="url(#metalRim)" stroke-width="2" />

  <!-- Name Text Along Curved Path -->
  <text font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="28" font-weight="bold" fill="url(#copperText)" letter-spacing="9" filter="url(#dropShadow)">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      SEEMA MAHUR
    </textPath>
  </text>
</svg>
